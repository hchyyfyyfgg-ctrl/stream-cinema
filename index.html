<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>سينما ستريم - CINEMA STREAM</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-main: #101012;
            --card-bg: #1a1a1e;
            --main-red: #E50914;
            --accent-gold: #FFD700;
            --text-main: #FFFFFF;
            --text-sub: #a0a0a0;
            --border-color: #2a2a30;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-main); color: var(--text-main); overflow-x: hidden; padding-bottom: 90px; }

        /* Header */
        header {
            display: flex; flex-direction: column; gap: 10px;
            padding: 12px 4%; background: rgba(16, 16, 18, 0.92); backdrop-filter: blur(12px);
            position: fixed; top: 0; width: 100%; z-index: 1000; border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .top-bar { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .logo { font-size: 1.3rem; font-weight: 900; color: var(--main-red); letter-spacing: 0.5px; display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
        
        .search-input {
            background: rgba(255,255,255,0.08); border: 1px solid var(--border-color); color: white;
            padding: 6px 14px; border-radius: 20px; outline: none; font-size: 0.8rem; width: 140px; transition: 0.3s;
        }
        .search-input:focus { width: 180px; background: #000; border-color: var(--main-red); }

        .nav-links { display: flex; gap: 10px; list-style: none; overflow-x: auto; white-space: nowrap; padding-bottom: 2px; }
        .nav-links::-webkit-scrollbar { display: none; }
        .nav-links a { color: var(--text-sub); text-decoration: none; font-size: 0.82rem; cursor: pointer; padding: 4px 10px; border-radius: 6px; transition: 0.2s; }
        .nav-links a.active { color: #fff; font-weight: bold; background: var(--main-red); }

        /* Hero Featured */
        .hero {
            position: relative; height: 52vh; min-height: 350px; background-size: cover; background-position: center top;
            display: flex; align-items: flex-end; padding: 0 4% 25px 4%; margin-top: 85px; border-radius: 0 0 16px 16px; overflow: hidden;
        }
        .hero-overlay {
            position: absolute; inset: 0;
            background: linear-gradient(180deg, rgba(16,16,18,0) 0%, rgba(16,16,18,0.7) 60%, var(--bg-main) 100%);
        }
        .hero-content { position: relative; z-index: 10; width: 100%; }
        .badge-trend { background: var(--accent-gold); color: #000; font-size: 0.65rem; font-weight: bold; padding: 2px 8px; border-radius: 4px; display: inline-block; margin-bottom: 6px; }
        .hero-title { font-size: 1.7rem; font-weight: 800; margin-bottom: 6px; text-shadow: 2px 2px 8px rgba(0,0,0,0.8); }
        .hero-desc { font-size: 0.8rem; color: #ccc; margin-bottom: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; max-width: 600px; }
        
        .hero-btns { display: flex; gap: 10px; }
        .btn-action {
            padding: 8px 18px; border-radius: 6px; font-size: 0.85rem; font-weight: bold;
            border: none; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: 0.2s;
        }
        .btn-play { background: #fff; color: #000; }
        .btn-play:active { transform: scale(0.95); }
        .btn-add { background: rgba(255,255,255,0.2); color: #fff; backdrop-filter: blur(8px); }

        /* Content Sections */
        .section-container { padding: 20px 4% 0 4%; }
        .section-title { font-size: 1.1rem; font-weight: bold; margin-bottom: 12px; color: #fff; }

        .media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 12px; }

        .card {
            background-size: cover; background-position: center; height: 165px;
            border-radius: 8px; position: relative; cursor: pointer; overflow: hidden;
            border: 1px solid var(--border-color); transition: transform 0.2s;
        }
        .card:active { transform: scale(0.96); }
        .card-type { position: absolute; top: 6px; right: 6px; background: rgba(0,0,0,0.75); font-size: 0.6rem; padding: 2px 6px; border-radius: 4px; color: #fff; backdrop-filter: blur(4px); }
        .card-info {
            position: absolute; bottom: 0; inset-x: 0; background: linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.95) 100%);
            padding: 8px 6px 6px 6px; display: flex; flex-direction: column; gap: 2px;
        }
        .card-title { font-size: 0.75rem; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.65rem; color: var(--accent-gold); margin-top: 2px; }

        /* Admin Controls */
        #adminPanel {
            background: var(--card-bg); margin: 90px 4% 10px 4%; padding: 16px;
            border-radius: 10px; border: 1px solid var(--main-red); display: none;
        }
        .form-group { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
        .form-group input, .form-group select, textarea {
            background: #111; border: 1px solid #333; padding: 10px; color: white; border-radius: 6px; outline: none; width: 100%; font-size: 0.85rem;
        }

        /* Video Player Modal */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 2000; justify-content: center; align-items: center; padding: 10px; }
        .modal-box { background: var(--card-bg); width: 100%; max-width: 700px; border-radius: 12px; overflow: hidden; position: relative; max-height: 95vh; overflow-y: auto; }
        .close-btn { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.8); border: none; color: white; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; z-index: 10; font-size: 1.1rem; }
        
        .player-wrapper { position: relative; padding-bottom: 56.25%; height: 0; background: #000; }
        .player-wrapper iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

        .selector-bar { display: flex; overflow-x: auto; gap: 8px; padding: 10px 12px; background: #111; border-bottom: 1px solid #222; }
        .selector-bar::-webkit-scrollbar { display: none; }
        .chip-btn { flex: 0 0 auto; background: #222; border: 1px solid #444; color: white; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 0.78rem; }
        .chip-btn.active { background: var(--main-red); border-color: var(--main-red); font-weight: bold; }

        .media-details-box { padding: 14px; }
        .media-details-box h3 { font-size: 1.1rem; margin-bottom: 6px; }
        .media-details-box p { font-size: 0.8rem; color: #aaa; line-height: 1.4; }

        @media (min-width: 600px) {
            .media-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; }
            .card { height: 210px; }
            .hero { height: 60vh; }
            .hero-title { font-size: 2.3rem; }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="top-bar">
            <div class="logo" id="appLogo"><i class="fas fa-play-circle"></i> سينما ستريم</div>
            <input type="text" class="search-input" id="searchInput" placeholder="بحث..." oninput="handleSearch()">
        </div>
        <ul class="nav-links">
            <li><a class="active" onclick="filterCategory('الكل', event)">الرئيسية</a></li>
            <li><a onclick="filterCategory('فيلم', event)">الأفلام</a></li>
            <li><a onclick="filterCategory('مسلسل', event)">المسلسلات</a></li>
            <li><a onclick="filterCategory('المفضلة', event)">المفضلة</a></li>
        </ul>
    </header>

    <!-- Banner -->
    <div class="hero" id="heroBanner">
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <span class="badge-trend"><i class="fas fa-fire"></i> الأبرز حالياً</span>
            <h1 class="hero-title" id="heroTitle">جاري التحميل...</h1>
            <p class="hero-desc" id="heroOverview">شاهد أفضل وأحدث الأفلام والمسلسلات عالية الجودة مباشرة.</p>
            <div class="hero-btns">
                <button class="btn-action btn-play" id="heroPlayBtn"><i class="fas fa-play"></i> مشاهدة الآن</button>
                <button class="btn-action btn-add" id="heroFavBtn" onclick="toggleHeroFav()"><i class="fas fa-heart"></i> للمفضلة</button>
            </div>
        </div>
    </div>

    <!-- Admin Panel (Hidden) -->
    <section id="adminPanel">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h4 style="color: var(--main-red);"><i class="fas fa-plus-circle"></i> إضافة فيلم أو مسلسل جديد</h4>
            <button class="btn-action btn-add" style="font-size:0.75rem; padding:4px 8px;" onclick="handleLogout()">خروج</button>
        </div>
        <form id="addForm" onsubmit="saveMedia(event)">
            <div class="form-group">
                <input type="text" id="title" placeholder="عنوان العمل" required>
                <select id="type" onchange="toggleTypeInputs()">
                    <option value="فيلم">فيلم</option>
                    <option value="مسلسل">مسلسل</option>
                </select>
                <input type="number" id="year" placeholder="السنة (مثال 2024)">
                <input type="number" id="rating" placeholder="التقييم (مثال 8.5)" step="0.1">
                <input type="url" id="poster" placeholder="رابط صورة البوستر المباشر" required>
            </div>

            <div id="movieInputs" style="margin-top:10px;">
                <input type="url" id="server1" placeholder="رابط سيرفر التشغيل الرئيسي (Embed)" style="margin-top:4px;">
                <input type="url" id="server2" placeholder="رابط سيرفر احتياطي (اختياري)" style="margin-top:4px;">
            </div>

            <div id="seriesInputs" style="display:none; margin-top:10px;">
                <button type="button" class="btn-action btn-add" style="margin-bottom:8px; font-size:0.75rem;" onclick="addSeasonField()">+ إضافة موسم</button>
                <div id="seasonsBox"></div>
            </div>

            <textarea id="overview" placeholder="قصة العمل..." rows="2" style="margin-top:10px;"></textarea>
            <button type="submit" class="btn-action btn-play" style="margin-top:10px; width:100%; justify-content:center; background:var(--main-red); color:white;">نشر العمل في التطبيق</button>
        </form>
    </section>

    <!-- Media Grid -->
    <div class="section-container">
        <div class="section-title" id="gridTitle">الأحدث والمضاف مؤخراً</div>
        <div class="media-grid" id="mediaGrid"></div>
    </div>

    <!-- Auth Modal -->
    <div class="modal" id="authModal">
        <div class="modal-box" style="max-width: 300px; padding: 20px;">
            <button class="close-btn" onclick="closeModal('authModal')">&times;</button>
            <h4 style="margin-bottom: 12px; text-align:center; color: var(--main-red);">تسجيل دخول المشرف</h4>
            <input type="email" id="email" placeholder="البريد الإلكتروني" style="width:100%; padding:8px; margin-bottom:8px; background:#111; border:1px solid #444; color:white; border-radius:4px; font-size:0.8rem;">
            <input type="password" id="password" placeholder="كلمة المرور" style="width:100%; padding:8px; margin-bottom:12px; background:#111; border:1px solid #444; color:white; border-radius:4px; font-size:0.8rem;">
            <button class="btn-action btn-play" style="width:100%; justify-content:center; background:var(--main-red); color:white;" onclick="loginAdmin()">دخول</button>
        </div>
    </div>

    <!-- Player Modal -->
    <div class="modal" id="playerModal">
        <div class="modal-box">
            <button class="close-btn" onclick="closePlayer()">&times;</button>
            <div class="player-wrapper">
                <iframe id="videoIframe" allowfullscreen></iframe>
            </div>

            <div id="serverBar" class="selector-bar" style="display:none;"></div>
            <div id="seasonBar" class="selector-bar" style="display:none;"></div>
            <div id="epBar" class="selector-bar" style="display:none;"></div>

            <div class="media-details-box">
                <h3 id="playTitle">-</h3>
                <p id="playOverview">-</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, enableIndexedDbPersistence } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyALvUGKfiOLGjbnpldZ9IQfCR9sVMHU4WY",
            authDomain: "showa-4ea31.firebaseapp.com",
            databaseURL: "https://showa-4ea31-default-rtdb.firebaseio.com",
            projectId: "showa-4ea31",
            storageBucket: "showa-4ea31.firebasestorage.app",
            messagingSenderId: "161674174849",
            appId: "1:161674174849:web:2165916f33fe592db60880"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        enableIndexedDbPersistence(db).catch(() => {});

        let currentUser = null;
        let mediaList = [];
        let currentFilter = 'الكل';
        let favs = JSON.parse(localStorage.getItem('cinema_favs_v2') || '[]');
        let currentHeroId = null;
        let seasonCount = 0;

        // الدخول المخفي للمشرف (ضغطتان على الشعار)
        let clickTimer = 0;
        document.getElementById('appLogo').addEventListener('click', () => {
            clickTimer++;
            if (clickTimer === 2) {
                clickTimer = 0;
                if (currentUser) {
                    document.getElementById('adminPanel').style.display = 'block';
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                } else {
                    document.getElementById('authModal').style.display = 'flex';
                }
            }
            setTimeout(() => { clickTimer = 0; }, 500);
        });

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            document.getElementById('adminPanel').style.display = user ? 'block' : 'none';
            fetchData();
        });

        function fetchData() {
            onSnapshot(collection(db, "media"), (snap) => {
                mediaList = [];
                snap.forEach(d => mediaList.push({ id: d.id, ...d.data() }));
                if (mediaList.length > 0) renderHero(mediaList[0]);
                renderGrid(mediaList);
            });
        }

        function renderHero(item) {
            currentHeroId = item.id;
            document.getElementById('heroBanner').style.backgroundImage = `url('${item.poster}')`;
            document.getElementById('heroTitle').innerText = item.title;
            document.getElementById('heroOverview').innerText = item.overview || 'استمتع بالمشاهدة المباشرة بدقة عالية وبدون تقطيع.';
            document.getElementById('heroPlayBtn').onclick = () => playMedia(item.id);
        }

        window.toggleHeroFav = () => {
            if (currentHeroId) toggleFav(currentHeroId);
        };

        function renderGrid(list) {
            const grid = document.getElementById('mediaGrid');
            grid.innerHTML = '';

            let filtered = list;
            if (currentFilter === 'المفضلة') filtered = filtered.filter(i => favs.includes(i.id));
            else if (currentFilter !== 'الكل') filtered = filtered.filter(i => i.type === currentFilter);

            const q = document.getElementById('searchInput').value.toLowerCase();
            if (q) filtered = filtered.filter(i => i.title.toLowerCase().includes(q));

            if (filtered.length === 0) {
                grid.innerHTML = `<div style="color:#888; font-size:0.85rem; grid-column: 1/-1; padding:20px 0;">لا تتوفر أعمال حالياً.</div>`;
                return;
            }

            filtered.forEach(item => {
                const isFav = favs.includes(item.id);
                const card = document.createElement('div');
                card.className = 'card';
                card.style.backgroundImage = `url('${item.poster}')`;
                card.innerHTML = `
                    <div class="card-type">${item.type}</div>
                    <div class="card-info">
                        <div class="card-title">${item.title}</div>
                        <div class="card-meta">
                            <span>★ ${item.rating || '8.0'}</span>
                            <div>
                                <i class="${isFav ? 'fas' : 'far'} fa-heart" onclick="toggleFav('${item.id}', event)" style="${isFav ? 'color:red;' : ''}"></i>
                                ${currentUser ? `<i class="fas fa-trash" style="margin-right:8px; color:#ff4444;" onclick="deleteItem('${item.id}', event)"></i>` : ''}
                            </div>
                        </div>
                    </div>
                `;
                card.onclick = (e) => { if (e.target.tagName !== 'I') playMedia(item.id); };
                grid.appendChild(card);
            });
        }

        window.playMedia = (id) => {
            const item = mediaList.find(m => m.id === id);
            if (!item) return;

            document.getElementById('playTitle').innerText = item.title;
            document.getElementById('playOverview').innerText = item.overview || '';

            const iframe = document.getElementById('videoIframe');
            const serverBar = document.getElementById('serverBar');
            const seasonBar = document.getElementById('seasonBar');
            const epBar = document.getElementById('epBar');

            serverBar.style.display = 'none';
            seasonBar.style.display = 'none';
            epBar.style.display = 'none';
            serverBar.innerHTML = ''; seasonBar.innerHTML = ''; epBar.innerHTML = '';

            if (item.type === 'فيلم') {
                if (item.servers && item.servers.length > 0) {
                    iframe.src = item.servers[0].url;
                    if (item.servers.length > 1) {
                        serverBar.style.display = 'flex';
                        item.servers.forEach((srv, idx) => {
                            const btn = document.createElement('button');
                            btn.className = `chip-btn ${idx === 0 ? 'active' : ''}`;
                            btn.innerText = srv.name || `سيرفر ${idx + 1}`;
                            btn.onclick = () => {
                                document.querySelectorAll('#serverBar .chip-btn').forEach(b => b.classList.remove('active'));
                                btn.classList.add('active');
                                iframe.src = srv.url;
                            };
                            serverBar.appendChild(btn);
                        });
                    }
                }
            } else if (item.type === 'مسلسل' && item.seasons && item.seasons.length > 0) {
                seasonBar.style.display = 'flex';
                epBar.style.display = 'flex';

                item.seasons.forEach((s, idx) => {
                    const btn = document.createElement('button');
                    btn.className = `chip-btn ${idx === 0 ? 'active' : ''}`;
                    btn.innerText = `الموسم ${s.seasonNumber}`;
                    btn.onclick = () => {
                        document.querySelectorAll('#seasonBar .chip-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        renderEpisodes(s.episodes, iframe);
                    };
                    seasonBar.appendChild(btn);
                });

                renderEpisodes(item.seasons[0].episodes, iframe);
            }

            document.getElementById('playerModal').style.display = 'flex';
        };

        function renderEpisodes(episodes, iframe) {
            const epBar = document.getElementById('epBar');
            epBar.innerHTML = '';
            if (!episodes || episodes.length === 0) return;

            episodes.forEach((ep, idx) => {
                const btn = document.createElement('button');
                btn.className = `chip-btn ${idx === 0 ? 'active' : ''}`;
                btn.innerText = `حلقة ${ep.number}`;
                btn.onclick = () => {
                    document.querySelectorAll('#epBar .chip-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    iframe.src = ep.url;
                };
                epBar.appendChild(btn);
            });

            iframe.src = episodes[0].url;
        }

        window.addSeasonField = () => {
            seasonCount++;
            const container = document.getElementById('seasonsBox');
            const div = document.createElement('div');
            div.style.background = '#111'; div.style.padding = '8px'; div.style.borderRadius = '6px'; div.style.marginTop = '6px';
            div.id = `s_box_${seasonCount}`;
            div.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span style="font-size:0.8rem;">الموسم ${seasonCount}</span>
                    <input type="number" class="ep-num-input" placeholder="عدد الحلقات" style="width:90px; padding:4px;">
                    <button type="button" class="btn-action btn-add" style="padding:2px 6px; font-size:0.7rem;" onclick="buildEpInputs(${seasonCount})">توليد</button>
                </div>
                <div id="ep_container_${seasonCount}"></div>
            `;
            container.appendChild(div);
        };

        window.buildEpInputs = (sId) => {
            const box = document.getElementById(`s_box_${sId}`);
            const count = parseInt(box.querySelector('.ep-num-input').value) || 0;
            const container = document.getElementById(`ep_container_${sId}`);
            container.innerHTML = '';
            for (let i = 1; i <= count; i++) {
                container.innerHTML += `
                    <div style="display:flex; gap:6px; margin-top:4px; align-items:center;">
                        <span style="font-size:0.7rem;">ح${i}:</span>
                        <input type="url" class="ep-url-field" data-ep="${i}" placeholder="رابط الحلقة" required style="padding:4px;">
                    </div>
                `;
            }
        };

        window.saveMedia = async (e) => {
            e.preventDefault();
            if (!currentUser) return alert("قم بتسجيل الدخول أولاً.");

            const type = document.getElementById('type').value;
            let servers = [], seasons = [];

            if (type === 'فيلم') {
                const s1 = document.getElementById('server1').value;
                const s2 = document.getElementById('server2').value;
                if (s1) servers.push({ name: 'سيرفر رئيسي', url: s1 });
                if (s2) servers.push({ name: 'سيرفر احتياطي', url: s2 });
            } else {
                const sBoxes = document.querySelectorAll('#seasonsBox > div');
                sBoxes.forEach((b, idx) => {
                    const fields = b.querySelectorAll('.ep-url-field');
                    let episodes = [];
                    fields.forEach(f => {
                        if (f.value.trim()) episodes.push({ number: f.getAttribute('data-ep'), url: f.value.trim() });
                    });
                    if (episodes.length > 0) seasons.push({ seasonNumber: idx + 1, episodes });
                });
            }

            await addDoc(collection(db, "media"), {
                title: document.getElementById('title').value,
                type,
                year: document.getElementById('year').value || '2024',
                rating: document.getElementById('rating').value || '8.0',
                poster: document.getElementById('poster').value,
                overview: document.getElementById('overview').value,
                servers, seasons
            });

            document.getElementById('addForm').reset();
            document.getElementById('seasonsBox').innerHTML = '';
            seasonCount = 0;
            alert("تم نشر العمل بنجاح في التطبيق!");
        };

        window.loginAdmin = async () => {
            try {
                await signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value);
                closeModal('authModal');
            } catch(e) { alert("بيانات الدخول خاطئة!"); }
        };

        window.handleLogout = () => signOut(auth);

        window.toggleFav = (id, e) => {
            if (e) e.stopPropagation();
            if (favs.includes(id)) favs = favs.filter(i => i !== id);
            else favs.push(id);
            localStorage.setItem('cinema_favs_v2', JSON.stringify(favs));
            renderGrid(mediaList);
        };

        window.closePlayer = () => {
            document.getElementById('playerModal').style.display = 'none';
            document.getElementById('videoIframe').src = '';
        };

        window.filterCategory = (cat, e) => {
            currentFilter = cat;
            document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('active'));
            if (e) e.target.classList.add('active');
            document.getElementById('gridTitle').innerText = cat === 'الكل' ? 'الأحدث والمضاف مؤخراً' : cat;
            renderGrid(mediaList);
        };

        window.handleSearch = () => renderGrid(mediaList);
        window.deleteItem = async (id, e) => {
            if (e) e.stopPropagation();
            if (confirm("هل تريد حذف هذا العمل؟")) await deleteDoc(doc(db, "media", id));
        };
        window.closeModal = (id) => document.getElementById(id).style.display = 'none';
        window.toggleTypeInputs = () => {
            const t = document.getElementById('type').value;
            document.getElementById('movieInputs').style.display = t === 'فيلم' ? 'block' : 'none';
            document.getElementById('seriesInputs').style.display = t === 'مسلسل' ? 'block' : 'none';
        };
    </script>
</body>
</html>
