<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>سينما ستريم - CINEMA STREAM</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-black: #141414;
            --card-bg: #181818;
            --main-red: #E50914;
            --text-main: #FFFFFF;
            --border-color: #333333;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-black); color: var(--text-main); overflow-x: hidden; padding-bottom: 70px; }

        /* Header Navigation */
        header {
            display: flex; flex-direction: column; gap: 10px;
            padding: 12px 4%; background: linear-gradient(180deg, rgba(0,0,0,0.95) 0%, rgba(20,20,20,0.8) 100%);
            position: fixed; top: 0; width: 100%; z-index: 1000; transition: background 0.3s;
        }
        header.scrolled { background-color: var(--bg-black); }

        .top-bar { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .logo { font-size: 1.4rem; font-weight: 900; color: var(--main-red); letter-spacing: 0.5px; display: flex; align-items: center; gap: 6px; cursor: pointer; }
        
        .user-controls { display: flex; align-items: center; gap: 8px; }
        .search-input {
            background: rgba(255,255,255,0.1); border: 1px solid #444; color: white;
            padding: 6px 10px; border-radius: 20px; outline: none; font-size: 0.8rem; width: 130px; transition: 0.3s;
        }
        .search-input:focus { width: 160px; background: rgba(0,0,0,0.8); border-color: var(--main-red); }

        .nav-links { display: flex; gap: 15px; list-style: none; overflow-x: auto; white-space: nowrap; padding-bottom: 2px; width: 100%; }
        .nav-links::-webkit-scrollbar { display: none; }
        .nav-links a { color: #b3b3b3; text-decoration: none; font-size: 0.85rem; cursor: pointer; transition: color 0.2s; }
        .nav-links a:hover, .nav-links a.active { color: #fff; font-weight: bold; border-bottom: 2px solid var(--main-red); padding-bottom: 2px; }

        /* Hero Banner */
        .hero {
            position: relative; height: 55vh; min-height: 380px; background-size: cover; background-position: center top;
            display: flex; align-items: flex-end; padding: 0 4% 30px 4%; margin-top: 80px;
        }
        .hero-overlay {
            position: absolute; inset: 0;
            background: linear-gradient(180deg, rgba(20,20,20,0) 0%, rgba(20,20,20,0.7) 60%, var(--bg-black) 100%);
        }
        .hero-content { position: relative; z-index: 10; max-width: 100%; }
        .hero-title { font-size: 1.8rem; font-weight: 800; margin-bottom: 8px; line-height: 1.2; text-shadow: 1px 1px 3px rgba(0,0,0,0.8); }
        .hero-overview { font-size: 0.85rem; color: #ccc; margin-bottom: 15px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        
        .btn-stream {
            padding: 8px 18px; border-radius: 4px; font-size: 0.9rem; font-weight: bold;
            border: none; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: 0.2s;
        }
        .btn-play { background: #fff; color: #000; }
        .btn-admin { background: var(--main-red); color: #fff; }
        .btn-info { background: rgba(109, 109, 110, 0.7); color: #fff; }

        /* Content Row & Cards */
        .section-row { padding: 15px 4%; position: relative; z-index: 20; }
        .row-header { font-size: 1.1rem; font-weight: bold; margin-bottom: 10px; color: #e5e5e5; }

        .cards-scroll-container { display: flex; gap: 10px; overflow-x: auto; scroll-behavior: smooth; padding: 5px 0 15px 0; }
        .cards-scroll-container::-webkit-scrollbar { display: none; }

        .stream-card {
            flex: 0 0 120px; height: 180px; background-size: cover; background-position: center;
            border-radius: 6px; position: relative; cursor: pointer; transition: transform 0.2s; overflow: hidden;
        }
        .stream-card:active { transform: scale(0.95); }

        .card-details {
            position: absolute; bottom: 0; inset-x: 0; background: linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.9) 100%);
            padding: 8px 6px; display: flex; flex-direction: column; gap: 4px;
        }
        .card-title { font-size: 0.75rem; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 2px; }
        .action-icon {
            width: 24px; height: 24px; border-radius: 50%; background: rgba(0,0,0,0.5);
            display: flex; align-items: center; justify-content: center; font-size: 0.65rem; color: #fff; border: 1px solid #fff;
        }

        /* Admin Panel Mobile Friendly */
        #adminPanel {
            background: var(--card-bg); margin: 90px 4% 10px 4%; padding: 15px;
            border-radius: 8px; border: 1px solid var(--main-red); display: none;
        }
        .form-grid { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
        .form-grid input, .form-grid select, textarea {
            background: #222; border: 1px solid #444; padding: 10px; color: white; border-radius: 4px; outline: none; width: 100%; font-size: 0.85rem;
        }

        .season-block { background: #111; border: 1px solid #333; padding: 10px; border-radius: 6px; margin-top: 10px; }

        /* Modals & Player Responsive */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 2000; justify-content: center; align-items: center; padding: 10px; }
        .modal-content { background: var(--card-bg); width: 100%; max-width: 600px; border-radius: 8px; overflow: hidden; position: relative; max-height: 95vh; overflow-y: auto; color: white; }
        .close-btn { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); border: none; color: white; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; z-index: 10; font-size: 1rem; }
        
        .iframe-container { position: relative; padding-bottom: 56.25%; height: 0; background: #000; }
        .iframe-container iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

        .selector-box { display: flex; overflow-x: auto; gap: 6px; padding: 10px; background: #111; border-bottom: 1px solid #222; }
        .selector-box::-webkit-scrollbar { display: none; }
        .select-btn { flex: 0 0 auto; background: #222; border: 1px solid #444; color: white; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.75rem; }
        .select-btn.active { background: var(--main-red); border-color: var(--main-red); font-weight: bold; }

        .comments-section { padding: 12px; border-top: 1px solid var(--border-color); }
        .comment-card { background: #222; padding: 8px; border-radius: 4px; margin-top: 6px; font-size: 0.75rem; word-break: break-word; }

        /* Desktop Adjustments */
        @media (min-width: 768px) {
            header { flex-direction: row; padding: 15px 4%; }
            .nav-links { width: auto; }
            .hero { height: 70vh; }
            .hero-title { font-size: 2.8rem; }
            .stream-card { flex: 0 0 160px; height: 240px; }
            .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header id="navbar">
        <div class="top-bar">
            <div class="logo"><i class="fas fa-film"></i> سينما ستريم</div>
            <div class="user-controls">
                <input type="text" class="search-input" id="searchInput" placeholder="بحث..." oninput="handleSearch()">
                <button id="authBtn" class="btn-stream btn-admin" style="padding: 4px 10px; font-size: 0.75rem;" onclick="openAuthModal()">المشرف</button>
            </div>
        </div>
        <ul class="nav-links">
            <li><a class="active" onclick="filterCategory('الكل')">الرئيسية</a></li>
            <li><a onclick="filterCategory('مسلسل')">المسلسلات</a></li>
            <li><a onclick="filterCategory('فيلم')">الأفلام</a></li>
            <li><a onclick="filterCategory('المفضلة')">قائمتي</a></li>
        </ul>
    </header>

    <!-- Hero Banner -->
    <div class="hero" id="heroBanner">
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <h1 class="hero-title" id="heroTitle">سينما ستريم</h1>
            <p class="hero-overview" id="heroOverview">شاهد أحدث الأفلام والمسلسلات بجودة عالية.</p>
            <div>
                <button class="btn-stream btn-play" id="heroPlayBtn"><i class="fas fa-play"></i> مشاهدة</button>
            </div>
        </div>
    </div>

    <!-- لوحة المشرف -->
    <section id="adminPanel">
        <h3 style="color: var(--main-red); font-size: 1rem;"><i class="fas fa-plus-circle"></i> إضافة عمل جديد</h3>
        <form id="addMediaForm" onsubmit="handleAddMedia(event)">
            <div class="form-grid">
                <input type="text" id="title" placeholder="عنوان العمل" required>
                <select id="type" onchange="toggleTypeFields()">
                    <option value="فيلم">فيلم</option>
                    <option value="مسلسل">مسلسل</option>
                </select>
                <input type="number" id="year" placeholder="السنة">
                <input type="number" id="rating" placeholder="التقييم (مثال 8.5)" step="0.1">
                <input type="url" id="poster" placeholder="رابط البوستر" required>
            </div>

            <div id="movieServers" style="margin-top:10px;">
                <input type="url" id="movieServer1" placeholder="رابط سيرفر الفيلم (Embed)">
            </div>

            <div id="seriesFields" style="display:none; margin-top:10px;">
                <button type="button" class="btn-stream btn-info" style="margin-bottom:10px; font-size:0.8rem;" onclick="addSeasonBlock()">+ إضافة موسم</button>
                <div id="seasonsContainer"></div>
            </div>

            <textarea id="overview" placeholder="نبذة مختصرة..." rows="2" style="margin-top:10px;"></textarea>
            <button type="submit" class="btn-stream btn-admin" style="margin-top:10px; width:100%; justify-content:center;">نشر العمل</button>
        </form>
    </section>

    <!-- Content Rows -->
    <div class="section-row">
        <div class="row-header" id="rowTitle">الأحدث والأكثر مشاهدة</div>
        <div class="cards-scroll-container" id="mediaGrid"></div>
    </div>

    <!-- Modal Login -->
    <div class="modal" id="authModal">
        <div class="modal-content" style="max-width: 320px; padding: 20px;">
            <button class="close-btn" onclick="closeModal('authModal')">&times;</button>
            <h3 style="margin-bottom: 12px; text-align:center; color: var(--main-red);"><i class="fas fa-lock"></i> دخول المشرف</h3>
            <input type="email" id="email" value="abod@dmail.com" placeholder="البريد الإلكتروني" style="width:100%; padding:8px; margin-bottom:8px; background:#222; border:1px solid #444; color:white; border-radius:4px; font-size:0.85rem;">
            <input type="password" id="password" value="mmnnoopp99" placeholder="كلمة المرور" style="width:100%; padding:8px; margin-bottom:12px; background:#222; border:1px solid #444; color:white; border-radius:4px; font-size:0.85rem;">
            <button class="btn-stream btn-admin" style="width:100%; justify-content:center;" onclick="handleAuth()">دخول</button>
        </div>
    </div>

    <!-- Video Player Modal -->
    <div class="modal" id="playerModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closePlayer()">&times;</button>
            <div class="iframe-container">
                <iframe id="videoPlayer" allowfullscreen></iframe>
            </div>

            <div id="seasonsSelector" class="selector-box" style="display:none;"></div>
            <div id="episodesSelector" class="selector-box" style="display:none;"></div>

            <div class="comments-section">
                <h5 style="margin-bottom: 8px;"><i class="fas fa-comments"></i> التعليقات</h5>
                <div style="display:flex; gap:6px;">
                    <input type="text" id="commentText" placeholder="أضف تعليقك..." style="flex:1; background:#222; border:1px solid #444; color:white; padding:6px; border-radius:4px; font-size:0.8rem;">
                    <button class="btn-stream btn-admin" style="padding: 6px 12px; font-size: 0.8rem;" onclick="addComment()">إرسال</button>
                </div>
                <div id="commentList" style="margin-top:10px;"></div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyALvUGKfiOLGjbnpldZ9IQfCR9sVMHU4WY",
            authDomain: "showa-4ea31.firebaseapp.com",
            databaseURL: "https://showa-4ea31-default-rtdb.firebaseio.com",
            projectId: "showa-4ea31",
            storageBucket: "showa-4ea31.firebasestorage.app",
            messagingSenderId: "161674174849",
            appId: "1:161674174849:web:2165916f33fe592db60880"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let allMedia = [];
        let currentFilter = 'الكل';
        let favorites = JSON.parse(localStorage.getItem('cinema_favs') || '[]');
        let activeMediaId = null;
        let seasonCounter = 0;

        window.addEventListener('scroll', () => {
            document.getElementById('navbar').classList.toggle('scrolled', window.scrollY > 30);
        });

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            const authBtn = document.getElementById('authBtn');
            const adminPanel = document.getElementById('adminPanel');

            if (user) {
                authBtn.innerText = "خروج";
                authBtn.onclick = () => signOut(auth);
                adminPanel.style.display = 'block';
            } else {
                authBtn.innerText = "المشرف";
                authBtn.onclick = () => openAuthModal();
                adminPanel.style.display = 'none';
            }
            loadData();
        });

        function loadData() {
            onSnapshot(collection(db, "media"), (snapshot) => {
                allMedia = [];
                snapshot.forEach(docSnap => allMedia.push({ id: docSnap.id, ...docSnap.data() }));
                if(allMedia.length > 0) setupHero(allMedia[0]);
                renderGrid(allMedia);
            });
        }

        function setupHero(item) {
            document.getElementById('heroBanner').style.backgroundImage = `url('${item.poster}')`;
            document.getElementById('heroTitle').innerText = item.title;
            document.getElementById('heroOverview').innerText = item.overview || 'أحد أفضل العروض المتوفرة على سينما ستريم.';
            document.getElementById('heroPlayBtn').onclick = () => openPlayer(item.id);
        }

        function renderGrid(list) {
            const grid = document.getElementById('mediaGrid');
            grid.innerHTML = '';

            let filtered = list;
            if (currentFilter === 'المفضلة') filtered = filtered.filter(i => favorites.includes(i.id));
            else if (currentFilter !== 'الكل') filtered = filtered.filter(i => i.type === currentFilter);

            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            if (searchVal) filtered = filtered.filter(i => i.title.toLowerCase().includes(searchVal));

            filtered.forEach(item => {
                const isFav = favorites.includes(item.id);
                const card = document.createElement('div');
                card.className = 'stream-card';
                card.style.backgroundImage = `url('${item.poster}')`;
                card.innerHTML = `
                    <div class="card-details">
                        <div class="card-title">${item.title}</div>
                        <div style="font-size: 0.65rem; color: #46d369;">${item.rating || '8.5'} ★</div>
                        <div class="card-actions">
                            <button class="action-icon" onclick="openPlayer('${item.id}')"><i class="fas fa-play"></i></button>
                            <button class="action-icon" onclick="toggleFavorite('${item.id}', event)"><i class="${isFav ? 'fas' : 'far'} fa-heart"></i></button>
                            ${currentUser ? `<button class="action-icon" onclick="deleteMedia('${item.id}', event)"><i class="fas fa-trash"></i></button>` : ''}
                        </div>
                    </div>
                `;
                card.onclick = (e) => { if(e.target.tagName !== 'I' && e.target.tagName !== 'BUTTON') openPlayer(item.id); };
                grid.appendChild(card);
            });
        }

        window.openPlayer = (id) => {
            const item = allMedia.find(m => m.id === id);
            if (!item) return;

            activeMediaId = id;
            const player = document.getElementById('videoPlayer');
            const seasonsBox = document.getElementById('seasonsSelector');
            const epBox = document.getElementById('episodesSelector');

            seasonsBox.innerHTML = '';
            epBox.innerHTML = '';

            if (item.type === 'مسلسل' && item.seasons && item.seasons.length > 0) {
                seasonsBox.style.display = 'flex';
                epBox.style.display = 'flex';

                item.seasons.forEach((s, sIdx) => {
                    const sBtn = document.createElement('button');
                    sBtn.className = `select-btn ${sIdx === 0 ? 'active' : ''}`;
                    sBtn.innerText = `الموسم ${s.seasonNumber}`;
                    sBtn.onclick = () => {
                        document.querySelectorAll('#seasonsSelector .select-btn').forEach(b => b.classList.remove('active'));
                        sBtn.classList.add('active');
                        renderEpisodes(s.episodes, player);
                    };
                    seasonsBox.appendChild(sBtn);
                });

                renderEpisodes(item.seasons[0].episodes, player);
            } else {
                seasonsBox.style.display = 'none';
                epBox.style.display = 'none';
                if(item.servers && item.servers.length > 0) player.src = item.servers[0].url;
            }

            loadComments(id);
            document.getElementById('playerModal').style.display = 'flex';
        };

        function renderEpisodes(episodes, player) {
            const epBox = document.getElementById('episodesSelector');
            epBox.innerHTML = '';
            if (!episodes || episodes.length === 0) return;

            episodes.forEach((ep, epIdx) => {
                const epBtn = document.createElement('button');
                epBtn.className = `select-btn ${epIdx === 0 ? 'active' : ''}`;
                epBtn.innerText = `حلقة ${ep.number}`;
                epBtn.onclick = () => {
                    document.querySelectorAll('#episodesSelector .select-btn').forEach(b => b.classList.remove('active'));
                    epBtn.classList.add('active');
                    player.src = ep.url;
                };
                epBox.appendChild(epBtn);
            });

            player.src = episodes[0].url;
        }

        window.addSeasonBlock = () => {
            seasonCounter++;
            const container = document.getElementById('seasonsContainer');
            const block = document.createElement('div');
            block.className = 'season-block';
            block.id = `season_block_${seasonCounter}`;
            block.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                    <strong style="font-size:0.85rem;">الموسم ${seasonCounter}</strong>
                    <input type="number" class="ep-count-input" placeholder="عدد الحلقات" min="1" style="width:100px; padding:4px;">
                    <button type="button" class="btn-stream btn-info" style="padding:2px 6px; font-size:0.75rem;" onclick="generateEpisodesForSeason(${seasonCounter})">توليد</button>
                </div>
                <div id="episodes_container_${seasonCounter}"></div>
            `;
            container.appendChild(block);
        };

        window.generateEpisodesForSeason = (sNum) => {
            const block = document.getElementById(`season_block_${sNum}`);
            const count = parseInt(block.querySelector('.ep-count-input').value) || 0;
            const container = document.getElementById(`episodes_container_${sNum}`);
            container.innerHTML = '';

            for (let i = 1; i <= count; i++) {
                const div = document.createElement('div');
                div.style.display = 'flex';
                div.style.gap = '6px';
                div.style.marginTop = '4px';
                div.innerHTML = `
                    <span style="font-size:0.75rem; line-height:30px;">ح${i}:</span>
                    <input type="url" class="ep-url-input" data-ep="${i}" placeholder="رابط الحلقة" required style="padding:4px;">
                `;
                container.appendChild(div);
            }
        };

        window.handleAddMedia = async (e) => {
            e.preventDefault();
            if (!currentUser) return alert("يجب تسجيل الدخول لإضافة المحتوى.");

            const type = document.getElementById('type').value;
            let servers = [], seasons = [];

            if (type === 'فيلم') {
                servers.push({ name: 'سيرفر 1', url: document.getElementById('movieServer1').value });
            } else {
                const blocks = document.querySelectorAll('.season-block');
                blocks.forEach((block, idx) => {
                    const epInputs = block.querySelectorAll('.ep-url-input');
                    let episodes = [];
                    epInputs.forEach(input => {
                        if (input.value.trim()) {
                            episodes.push({ number: input.getAttribute('data-ep'), url: input.value.trim() });
                        }
                    });
                    if (episodes.length > 0) {
                        seasons.push({ seasonNumber: idx + 1, episodes });
                    }
                });
            }

            await addDoc(collection(db, "media"), {
                title: document.getElementById('title').value,
                type: type,
                year: document.getElementById('year').value || '2024',
                rating: document.getElementById('rating').value || '8.0',
                poster: document.getElementById('poster').value,
                overview: document.getElementById('overview').value,
                servers, seasons
            });

            document.getElementById('addMediaForm').reset();
            document.getElementById('seasonsContainer').innerHTML = '';
            seasonCounter = 0;
            alert("تم نشر العمل بنجاح!");
        };

        async function loadComments(id) {
            const list = document.getElementById('commentList');
            const q = query(collection(db, "comments"), where("mediaId", "==", id));
            onSnapshot(q, (snap) => {
                list.innerHTML = '';
                snap.forEach(d => {
                    const c = d.data();
                    list.innerHTML += `<div class="comment-card"><strong>${c.user}</strong>: ${c.text}</div>`;
                });
            });
        }

        window.addComment = async () => {
            const txt = document.getElementById('commentText').value;
            if(!txt || !activeMediaId) return;
            const userName = currentUser ? currentUser.email : "زائر";
            await addDoc(collection(db, "comments"), { mediaId: activeMediaId, user: userName, text: txt });
            document.getElementById('commentText').value = '';
        };

        window.handleAuth = async () => {
            try {
                await signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value);
                closeModal('authModal');
            } catch(e) { alert("خطأ: " + e.message); }
        };

        window.toggleFavorite = (id, e) => {
            e.stopPropagation();
            if (favorites.includes(id)) favorites = favorites.filter(i => i !== id);
            else favorites.push(id);
            localStorage.setItem('cinema_favs', JSON.stringify(favorites));
            renderGrid(allMedia);
        };

        window.closePlayer = () => {
            document.getElementById('playerModal').style.display = 'none';
            document.getElementById('videoPlayer').src = '';
        };

        window.filterCategory = (cat) => {
            currentFilter = cat;
            document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('rowTitle').innerText = cat === 'الكل' ? 'الأحدث والأكثر مشاهدة' : cat;
            renderGrid(allMedia);
        };

        window.handleSearch = () => renderGrid(allMedia);
        window.deleteMedia = async (id, e) => {
            e.stopPropagation();
            if(confirm("حذف هذا العمل؟")) await deleteDoc(doc(db, "media", id));
        };

        window.openAuthModal = () => document.getElementById('authModal').style.display = 'flex';
        window.closeModal = (id) => document.getElementById(id).style.display = 'none';
        window.toggleTypeFields = () => {
            const type = document.getElementById('type').value;
            document.getElementById('movieServers').style.display = type === 'فيلم' ? 'block' : 'none';
            document.getElementById('seriesFields').style.display = type === 'مسلسل' ? 'block' : 'none';
        };
    </script>
</body>
</html>
