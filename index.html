<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STREAMFLIX - نتفليكس العرب</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-black: #141414;
            --card-bg: #181818;
            --netflix-red: #E50914;
            --netflix-red-hover: #b81d24;
            --text-main: #FFFFFF;
            --text-sub: #AAAAAA;
            --border-color: #333333;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg-black); color: var(--text-main); overflow-x: hidden; padding-bottom: 50px; }

        /* Navbar */
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 4%; background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, transparent 100%);
            position: fixed; top: 0; width: 100%; z-index: 1000; transition: background 0.3s;
        }
        header.scrolled { background-color: var(--bg-black); }

        .logo { font-size: 1.8rem; font-weight: 900; color: var(--netflix-red); letter-spacing: 1px; display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .nav-links { display: flex; gap: 20px; list-style: none; align-items: center; }
        .nav-links a { color: #e5e5e5; text-decoration: none; font-size: 0.9rem; transition: color 0.3s; cursor: pointer; }
        .nav-links a:hover, .nav-links a.active { color: #fff; font-weight: bold; }

        .user-controls { display: flex; align-items: center; gap: 15px; }
        .search-input {
            background: rgba(0,0,0,0.75); border: 1px solid #fff; color: white;
            padding: 5px 10px; border-radius: 4px; outline: none; font-size: 0.85rem; width: 180px;
        }

        /* Hero Banner (Featured Content) */
        .hero {
            position: relative; height: 75vh; background-size: cover; background-position: center top;
            display: flex; align-items: center; padding: 0 4%; margin-bottom: -50px;
        }
        .hero-overlay {
            position: absolute; inset: 0;
            background: linear-gradient(180deg, rgba(20,20,20,0.2) 0%, rgba(20,20,20,0.8) 70%, var(--bg-black) 100%),
                        linear-gradient(90deg, rgba(20,20,20,0.9) 0%, transparent 60%);
        }
        .hero-content { position: relative; z-index: 10; max-width: 550px; }
        .hero-title { font-size: 3rem; font-weight: 800; margin-bottom: 15px; line-height: 1.1; text-shadow: 2px 2px 4px rgba(0,0,0,0.6); }
        .hero-overview { font-size: 0.95rem; color: #ddd; margin-bottom: 20px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .hero-btns { display: flex; gap: 12px; }
        .btn-netflix {
            padding: 10px 24px; border-radius: 4px; font-size: 1rem; font-weight: bold;
            border: none; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.2s;
        }
        .btn-play { background: #fff; color: #000; }
        .btn-play:hover { background: rgba(255,255,255,0.75); }
        .btn-info { background: rgba(109, 109, 110, 0.7); color: #fff; }
        .btn-info:hover { background: rgba(109, 109, 110, 0.4); }

        /* Rows & Carousels */
        .section-row { padding: 20px 4%; position: relative; z-index: 20; }
        .row-header { font-size: 1.3rem; font-weight: bold; margin-bottom: 12px; color: #e5e5e5; }

        .cards-scroll-container {
            display: flex; gap: 12px; overflow-x: auto; scroll-behavior: smooth; padding: 10px 0;
        }
        .cards-scroll-container::-webkit-scrollbar { display: none; }

        /* Netflix Card Style */
        .netflix-card {
            flex: 0 0 180px; height: 260px; background-size: cover; background-position: center;
            border-radius: 4px; position: relative; cursor: pointer; transition: transform 0.3s ease, z-index 0.3s;
            overflow: hidden;
        }
        .netflix-card:hover { transform: scale(1.1); z-index: 99; box-shadow: 0 10px 20px rgba(0,0,0,0.8); }

        .card-details {
            position: absolute; bottom: 0; inset-x: 0; background: linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.95) 100%);
            padding: 12px; display: flex; flex-direction: column; gap: 6px; opacity: 0; transition: opacity 0.3s;
        }
        .netflix-card:hover .card-details { opacity: 1; }
        .card-title { font-size: 0.85rem; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
        .action-icon {
            width: 28px; height: 28px; border-radius: 50%; background: rgba(255,255,255,0.2);
            display: flex; align-items: center; justify-content: center; font-size: 0.75rem; color: #fff; border: 1px solid #fff;
        }
        .action-icon:hover { background: #fff; color: #000; }

        /* Admin Controls Overlay */
        #adminPanel {
            background: var(--card-bg); margin: 80px 4% 20px 4%; padding: 20px;
            border-radius: 8px; border: 1px solid var(--netflix-red); display: none;
        }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-top: 10px; }
        .form-grid input, .form-grid select, textarea {
            background: #222; border: 1px solid #444; padding: 10px; color: white; border-radius: 4px; outline: none; width: 100%;
        }

        /* Modals */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 2000; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: var(--card-bg); width: 100%; max-width: 800px; border-radius: 8px; overflow: hidden; position: relative; max-height: 90vh; overflow-y: auto; color: white; }
        .close-btn { position: absolute; top: 15px; left: 15px; background: rgba(0,0,0,0.5); border: none; color: white; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; z-index: 10; }
        
        .iframe-container { position: relative; padding-bottom: 56.25%; height: 0; }
        .iframe-container iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

        .server-selector, .episodes-list { display: flex; flex-wrap: wrap; gap: 8px; padding: 15px; background: #111; }
        .server-btn, .ep-btn { background: #333; border: none; color: white; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 0.85rem; }
        .server-btn.active, .ep-btn.active { background: var(--netflix-red); font-weight: bold; }

        .comments-section { padding: 20px; border-top: 1px solid var(--border-color); }
        .comment-card { background: #222; padding: 10px; border-radius: 4px; margin-top: 8px; font-size: 0.85rem; }
    </style>
</head>
<body>

    <!-- Header -->
    <header id="navbar">
        <div class="logo"><i class="fas fa-play-circle"></i> STREAMFLIX</div>
        <ul class="nav-links">
            <li><a class="active" onclick="filterCategory('الكل')">الرئيسية</a></li>
            <li><a onclick="filterCategory('مسلسل')">المسلسلات</a></li>
            <li><a onclick="filterCategory('فيلم')">الأفلام</a></li>
            <li><a onclick="filterCategory('المفضلة')">قائمتي</a></li>
        </ul>
        <div class="user-controls">
            <input type="text" class="search-input" id="searchInput" placeholder="ابحث..." oninput="handleSearch()">
            <button id="authBtn" class="btn-netflix btn-play" style="padding: 5px 12px; font-size: 0.85rem;" onclick="openAuthModal()">دخول</button>
        </div>
    </header>

    <!-- Hero Banner (Movie Spotlight) -->
    <div class="hero" id="heroBanner">
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <h1 class="hero-title" id="heroTitle">جاري التحميل...</h1>
            <p class="hero-overview" id="heroOverview">اختر أي فيلم أو مسلسل للبدء في المشاهدة الفورية بجودة عالية.</p>
            <div class="hero-btns">
                <button class="btn-netflix btn-play" id="heroPlayBtn"><i class="fas fa-play"></i> تشغيل</button>
            </div>
        </div>
    </div>

    <!-- Admin Panel -->
    <section id="adminPanel">
        <h3 style="color: var(--netflix-red);"><i class="fas fa-tools"></i> لوحة التحكم (إضافة محتوى جديد)</h3>
        <form id="addMediaForm" onsubmit="handleAddMedia(event)">
            <div class="form-grid">
                <input type="text" id="title" placeholder="العنوان" required>
                <select id="type" onchange="toggleTypeFields()">
                    <option value="فيلم">فيلم</option>
                    <option value="مسلسل">مسلسل</option>
                </select>
                <input type="number" id="year" placeholder="السنة">
                <input type="number" id="rating" placeholder="التقييم (مثال 8.5)" step="0.1">
                <input type="url" id="poster" placeholder="رابط البوستر" required>
            </div>
            <div id="movieServers" style="margin-top:10px;">
                <input type="url" id="movieServer1" placeholder="رابط السيرفر الأساسي (Embed)" required>
            </div>
            <div id="seriesFields" style="display:none; margin-top:10px;">
                <input type="number" id="epCount" placeholder="عدد الحلقات" min="1" style="width:150px;">
                <button type="button" class="btn-netflix btn-info" style="margin-top:5px;" onclick="generateEpisodeInputs()">توليد الحلقات</button>
                <div id="episodesContainer" style="margin-top:10px;"></div>
            </div>
            <textarea id="overview" placeholder="وصف المختصر..." rows="2" style="margin-top:10px;"></textarea>
            <button type="submit" class="btn-netflix btn-play" style="margin-top:10px; width:100%; background:var(--netflix-red); color:white;">نشر إلى Streamflix</button>
        </form>
    </section>

    <!-- Content Categories (Rows) -->
    <div class="section-row">
        <div class="row-header" id="rowTitle">الأحدث والأكثر مشاهدة</div>
        <div class="cards-scroll-container" id="mediaGrid"></div>
    </div>

    <!-- Auth Modal -->
    <div class="modal" id="authModal">
        <div class="modal-content" style="max-width: 350px; padding: 25px;">
            <button class="close-btn" onclick="closeModal('authModal')">&times;</button>
            <h2 style="margin-bottom: 20px;" id="authTitle">تسجيل الدخول</h2>
            <input type="email" id="email" value="abod@dmail.com" placeholder="البريد الإلكتروني" style="width:100%; padding:10px; margin-bottom:10px; background:#333; border:none; color:white; border-radius:4px;">
            <input type="password" id="password" value="mmnnoopp99" placeholder="كلمة المرور" style="width:100%; padding:10px; margin-bottom:15px; background:#333; border:none; color:white; border-radius:4px;">
            <button class="btn-netflix btn-play" style="width:100%; justify-content:center; background:var(--netflix-red); color:white;" onclick="handleAuth()">دخول</button>
            <button class="btn-netflix btn-info" style="width:100%; justify-content:center; margin-top:8px;" onclick="quickAdminAuth()">دخول المسؤول (Admin)</button>
        </div>
    </div>

    <!-- Video Player Modal -->
    <div class="modal" id="playerModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closePlayer()">&times;</button>
            <div class="iframe-container">
                <iframe id="videoPlayer" allowfullscreen></iframe>
            </div>
            <div id="serverSelector" class="server-selector"></div>
            <div id="episodesList" class="episodes-list" style="display:none;"></div>
            <div class="comments-section">
                <h4><i class="fas fa-comments"></i> التعليقات</h4>
                <div style="display:flex; gap:10px; margin-top:10px;">
                    <input type="text" id="commentText" placeholder="أضف تعليقاً..." style="flex:1; background:#222; border:1px solid #444; color:white; padding:8px; border-radius:4px;">
                    <button class="btn-netflix btn-play" style="background:var(--netflix-red); color:white;" onclick="addComment()">إرسال</button>
                </div>
                <div id="commentList" style="margin-top:15px;"></div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyALvUGKfiOLGjbnpldZ9IQfCR9sVMHU4WY",
            authDomain: "showa-4ea31.firebaseapp.com",
            databaseURL: "https://showa-4ea31-default-rtdb.firebaseio.com",
            projectId: "showa-4ea31",
            storageBucket: "showa-4ea31.firebasestorage.app",
            messagingSenderId: "161674174849",
            appId: "1:161674174849:web:2165916f33fe592db60880"
        };

        const ADMIN_EMAIL = "abod@dmail.com";
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let allMedia = [];
        let currentFilter = 'الكل';
        let favorites = JSON.parse(localStorage.getItem('netflix_favs') || '[]');
        let activeMediaId = null;

        // Navbar Scroll Effect
        window.addEventListener('scroll', () => {
            document.getElementById('navbar').classList.toggle('scrolled', window.scrollY > 50);
        });

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            const authBtn = document.getElementById('authBtn');
            const adminPanel = document.getElementById('adminPanel');

            if (user) {
                authBtn.innerText = "خروج";
                authBtn.onclick = () => signOut(auth);
                adminPanel.style.display = (user.email === ADMIN_EMAIL) ? 'block' : 'none';
            } else {
                authBtn.innerText = "دخول";
                authBtn.onclick = () => openAuthModal();
                adminPanel.style.display = 'none';
            }
            loadData();
        });

        function loadData() {
            onSnapshot(collection(db, "media"), (snapshot) => {
                allMedia = [];
                snapshot.forEach(docSnap => allMedia.push({ id: docSnap.id, ...docSnap.data() }));
                if(allMedia.length > 0) setupHero(allMedia[0]);
                renderGrid(allMedia);
            });
        }

        function setupHero(item) {
            document.getElementById('heroBanner').style.backgroundImage = `url('${item.poster}')`;
            document.getElementById('heroTitle').innerText = item.title;
            document.getElementById('heroOverview').innerText = item.overview || 'استمتع بآلاف الأفلام والمسلسلات الحصرية عالية الدقة بدون إعلانات.';
            document.getElementById('heroPlayBtn').onclick = () => openPlayer(item.id);
        }

        function renderGrid(list) {
            const grid = document.getElementById('mediaGrid');
            grid.innerHTML = '';

            let filtered = list;
            if (currentFilter === 'المفضلة') filtered = filtered.filter(i => favorites.includes(i.id));
            else if (currentFilter !== 'الكل') filtered = filtered.filter(i => i.type === currentFilter);

            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            if (searchVal) filtered = filtered.filter(i => i.title.toLowerCase().includes(searchVal));

            filtered.forEach(item => {
                const isFav = favorites.includes(item.id);
                const card = document.createElement('div');
                card.className = 'netflix-card';
                card.style.backgroundImage = `url('${item.poster}')`;
                card.innerHTML = `
                    <div class="card-details">
                        <div class="card-title">${item.title}</div>
                        <div style="font-size: 0.7rem; color: #46d369;">${item.rating || '8.5'} ★</div>
                        <div class="card-actions">
                            <button class="action-icon" onclick="openPlayer('${item.id}')"><i class="fas fa-play"></i></button>
                            <button class="action-icon" onclick="toggleFavorite('${item.id}', event)"><i class="${isFav ? 'fas' : 'far'} fa-heart"></i></button>
                            ${currentUser && currentUser.email === ADMIN_EMAIL ? `<button class="action-icon" onclick="deleteMedia('${item.id}', event)"><i class="fas fa-trash"></i></button>` : ''}
                        </div>
                    </div>
                `;
                card.onclick = (e) => { if(e.target.tagName !== 'I' && e.target.tagName !== 'BUTTON') openPlayer(item.id); };
                grid.appendChild(card);
            });
        }

        window.toggleFavorite = (id, e) => {
            e.stopPropagation();
            if (favorites.includes(id)) favorites = favorites.filter(i => i !== id);
            else favorites.push(id);
            localStorage.setItem('netflix_favs', JSON.stringify(favorites));
            renderGrid(allMedia);
        };

        window.openPlayer = (id) => {
            const item = allMedia.find(m => m.id === id);
            if (!item) return;

            activeMediaId = id;
            const player = document.getElementById('videoPlayer');
            const serverBox = document.getElementById('serverSelector');
            const epList = document.getElementById('episodesList');

            serverBox.innerHTML = '';
            
            if (item.type === 'مسلسل' && item.episodes && item.episodes.length > 0) {
                epList.style.display = 'flex';
                epList.innerHTML = '';
                item.episodes.forEach((ep, idx) => {
                    const btn = document.createElement('button');
                    btn.className = `ep-btn ${idx === 0 ? 'active' : ''}`;
                    btn.innerText = `حلقة ${ep.number}`;
                    btn.onclick = () => {
                        document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        player.src = ep.servers[0].url;
                    };
                    epList.appendChild(btn);
                });
                player.src = item.episodes[0].servers[0].url;
            } else {
                epList.style.display = 'none';
                if(item.servers && item.servers.length > 0) player.src = item.servers[0].url;
            }

            loadComments(id);
            document.getElementById('playerModal').style.display = 'flex';
        };

        async function loadComments(id) {
            const list = document.getElementById('commentList');
            const q = query(collection(db, "comments"), where("mediaId", "==", id));
            onSnapshot(q, (snap) => {
                list.innerHTML = '';
                snap.forEach(d => {
                    const c = d.data();
                    list.innerHTML += `<div class="comment-card"><strong>${c.user}</strong>: ${c.text}</div>`;
                });
            });
        }

        window.addComment = async () => {
            if(!currentUser) return alert("قم بتسجيل الدخول أولاً");
            const txt = document.getElementById('commentText').value;
            if(!txt || !activeMediaId) return;
            await addDoc(collection(db, "comments"), { mediaId: activeMediaId, user: currentUser.email, text: txt });
            document.getElementById('commentText').value = '';
        };

        window.closePlayer = () => {
            document.getElementById('playerModal').style.display = 'none';
            document.getElementById('videoPlayer').src = '';
        };

        window.filterCategory = (cat) => {
            currentFilter = cat;
            document.getElementById('rowTitle').innerText = cat === 'الكل' ? 'الأحدث والأكثر مشاهدة' : cat;
            renderGrid(allMedia);
        };

        window.handleSearch = () => renderGrid(allMedia);
        window.deleteMedia = async (id, e) => {
            e.stopPropagation();
            if(confirm("حذف هذا العنصر؟")) await deleteDoc(doc(db, "media", id));
        };

        window.handleAuth = async () => {
            try {
                await signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value);
                closeModal('authModal');
            } catch(e) { alert(e.message); }
        };

        window.quickAdminAuth = async () => {
            await signInWithEmailAndPassword(auth, "abod@dmail.com", "mmnnoopp99");
            closeModal('authModal');
        };

        window.openAuthModal = () => document.getElementById('authModal').style.display = 'flex';
        window.closeModal = (id) => document.getElementById(id).style.display = 'none';
        window.toggleTypeFields = () => {
            const type = document.getElementById('type').value;
            document.getElementById('movieServers').style.display = type === 'فيلم' ? 'block' : 'none';
            document.getElementById('seriesFields').style.display = type === 'مسلسل' ? 'block' : 'none';
        };

        window.handleAddMedia = async (e) => {
            e.preventDefault();
            const type = document.getElementById('type').value;
            let servers = [], episodes = [];

            if(type === 'فيلم') {
                servers.push({ name: 'سيرفر 1', url: document.getElementById('movieServer1').value });
            }

            await addDoc(collection(db, "media"), {
                title: document.getElementById('title').value,
                type: type,
                year: document.getElementById('year').value || '2024',
                rating: document.getElementById('rating').value || '8.0',
                poster: document.getElementById('poster').value,
                overview: document.getElementById('overview').value,
                servers, episodes
            });
            document.getElementById('addMediaForm').reset();
        };
    </script>
</body>
</html>
