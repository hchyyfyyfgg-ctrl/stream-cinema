<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سينما ستريم - CINEMA STREAM</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-black: #141414;
            --card-bg: #181818;
            --main-red: #E50914;
            --text-main: #FFFFFF;
            --border-color: #333333;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg-black); color: var(--text-main); overflow-x: hidden; padding-bottom: 50px; }

        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 4%; background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, transparent 100%);
            position: fixed; top: 0; width: 100%; z-index: 1000; transition: background 0.3s;
        }
        header.scrolled { background-color: var(--bg-black); }

        .logo { font-size: 1.8rem; font-weight: 900; color: var(--main-red); letter-spacing: 1px; display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .nav-links { display: flex; gap: 20px; list-style: none; align-items: center; }
        .nav-links a { color: #e5e5e5; text-decoration: none; font-size: 0.9rem; transition: color 0.3s; cursor: pointer; }
        .nav-links a:hover, .nav-links a.active { color: #fff; font-weight: bold; }

        .user-controls { display: flex; align-items: center; gap: 12px; }
        .search-input {
            background: rgba(0,0,0,0.75); border: 1px solid #fff; color: white;
            padding: 5px 10px; border-radius: 4px; outline: none; font-size: 0.85rem; width: 170px;
        }

        .hero {
            position: relative; height: 75vh; background-size: cover; background-position: center top;
            display: flex; align-items: center; padding: 0 4%; margin-bottom: -50px;
        }
        .hero-overlay {
            position: absolute; inset: 0;
            background: linear-gradient(180deg, rgba(20,20,20,0.2) 0%, rgba(20,20,20,0.8) 70%, var(--bg-black) 100%),
                        linear-gradient(90deg, rgba(20,20,20,0.9) 0%, transparent 60%);
        }
        .hero-content { position: relative; z-index: 10; max-width: 550px; }
        .hero-title { font-size: 3rem; font-weight: 800; margin-bottom: 15px; line-height: 1.1; }
        .hero-overview { font-size: 0.95rem; color: #ddd; margin-bottom: 20px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .hero-btns { display: flex; gap: 12px; }
        
        .btn-stream {
            padding: 10px 24px; border-radius: 4px; font-size: 1rem; font-weight: bold;
            border: none; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.2s;
        }
        .btn-play { background: #fff; color: #000; }
        .btn-play:hover { background: rgba(255,255,255,0.75); }
        .btn-admin { background: var(--main-red); color: #fff; }
        .btn-info { background: rgba(109, 109, 110, 0.7); color: #fff; }

        .section-row { padding: 20px 4%; position: relative; z-index: 20; }
        .row-header { font-size: 1.3rem; font-weight: bold; margin-bottom: 12px; color: #e5e5e5; }

        .cards-scroll-container { display: flex; gap: 12px; overflow-x: auto; scroll-behavior: smooth; padding: 10px 0; }
        .cards-scroll-container::-webkit-scrollbar { display: none; }

        .stream-card {
            flex: 0 0 180px; height: 260px; background-size: cover; background-position: center;
            border-radius: 4px; position: relative; cursor: pointer; transition: transform 0.3s ease, z-index 0.3s;
            overflow: hidden;
        }
        .stream-card:hover { transform: scale(1.1); z-index: 99; box-shadow: 0 10px 20px rgba(0,0,0,0.8); }

        .card-details {
            position: absolute; bottom: 0; inset-x: 0; background: linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.95) 100%);
            padding: 12px; display: flex; flex-direction: column; gap: 6px; opacity: 0; transition: opacity 0.3s;
        }
        .stream-card:hover .card-details { opacity: 1; }
        .card-title { font-size: 0.85rem; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
        .action-icon {
            width: 28px; height: 28px; border-radius: 50%; background: rgba(255,255,255,0.2);
            display: flex; align-items: center; justify-content: center; font-size: 0.75rem; color: #fff; border: 1px solid #fff;
        }
        .action-icon:hover { background: #fff; color: #000; }

        /* لوحة إضافة المحتوى المحمية */
        #adminPanel {
            background: var(--card-bg); margin: 80px 4% 20px 4%; padding: 20px;
            border-radius: 8px; border: 1px solid var(--main-red); display: none;
        }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-top: 10px; }
        .form-grid input, .form-grid select, textarea {
            background: #222; border: 1px solid #444; padding: 10px; color: white; border-radius: 4px; outline: none; width: 100%;
        }

        .season-block { background: #111; border: 1px solid #333; padding: 10px; border-radius: 6px; margin-top: 10px; }

        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 2000; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: var(--card-bg); width: 100%; max-width: 850px; border-radius: 8px; overflow: hidden; position: relative; max-height: 90vh; overflow-y: auto; color: white; }
        .close-btn { position: absolute; top: 15px; left: 15px; background: rgba(0,0,0,0.5); border: none; color: white; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; z-index: 10; }
        
        .iframe-container { position: relative; padding-bottom: 56.25%; height: 0; }
        .iframe-container iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

        .selector-box { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 15px; background: #111; border-bottom: 1px solid #222; }
        .select-btn { background: #222; border: 1px solid #444; color: white; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 0.85rem; }
        .select-btn.active { background: var(--main-red); border-color: var(--main-red); font-weight: bold; }

        .comments-section { padding: 20px; border-top: 1px solid var(--border-color); }
        .comment-card { background: #222; padding: 10px; border-radius: 4px; margin-top: 8px; font-size: 0.85rem; }
    </style>
</head>
<body>

    <!-- Header -->
    <header id="navbar">
        <div class="logo"><i class="fas fa-film"></i> سينما ستريم</div>
        <ul class="nav-links">
            <li><a class="active" onclick="filterCategory('الكل')">الرئيسية</a></li>
            <li><a onclick="filterCategory('مسلسل')">المسلسلات</a></li>
            <li><a onclick="filterCategory('فيلم')">الأفلام</a></li>
            <li><a onclick="filterCategory('المفضلة')">قائمتي</a></li>
        </ul>
        <div class="user-controls">
            <input type="text" class="search-input" id="searchInput" placeholder="ابحث عن فيلم..." oninput="handleSearch()">
            <button id="authBtn" class="btn-stream btn-admin" style="padding: 6px 14px; font-size: 0.85rem;" onclick="openAuthModal()">دخول المشرف</button>
        </div>
    </header>

    <!-- Hero Banner -->
    <div class="hero" id="heroBanner">
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <h1 class="hero-title" id="heroTitle">سينما ستريم</h1>
            <p class="hero-overview" id="heroOverview">شاهد أحدث الأفلام والمسلسلات بجودة عالية وبدون إعلانات مزعجة.</p>
            <div class="hero-btns">
                <button class="btn-stream btn-play" id="heroPlayBtn"><i class="fas fa-play"></i> مشاهدة الآن</button>
            </div>
        </div>
    </div>

    <!-- لوحة المشرف لإضافة المسلسلات والأفلام (تظهر فقط بعد تسجيل الدخول) -->
    <section id="adminPanel">
        <h3 style="color: var(--main-red);"><i class="fas fa-plus-circle"></i> إضافة فيلم أو مسلسل جديد</h3>
        <form id="addMediaForm" onsubmit="handleAddMedia(event)">
            <div class="form-grid">
                <input type="text" id="title" placeholder="عنوان العمل" required>
                <select id="type" onchange="toggleTypeFields()">
                    <option value="فيلم">فيلم</option>
                    <option value="مسلسل">مسلسل</option>
                </select>
                <input type="number" id="year" placeholder="سنة الإنتاج">
                <input type="number" id="rating" placeholder="التقييم (مثال 8.5)" step="0.1">
                <input type="url" id="poster" placeholder="رابط صور البوستر" required>
            </div>

            <div id="movieServers" style="margin-top:10px;">
                <input type="url" id="movieServer1" placeholder="رابط سيرفر الفيلم (Embed)">
            </div>

            <div id="seriesFields" style="display:none; margin-top:10px;">
                <button type="button" class="btn-stream btn-info" style="margin-bottom:10px;" onclick="addSeasonBlock()">+ إضافة موسم جديد</button>
                <div id="seasonsContainer"></div>
            </div>

            <textarea id="overview" placeholder="نبذة مختصرة عن القصة..." rows="2" style="margin-top:10px;"></textarea>
            <button type="submit" class="btn-stream btn-admin" style="margin-top:10px; width:100%;">نشر إلى سينما ستريم</button>
        </form>
    </section>

    <!-- Rows -->
    <div class="section-row">
        <div class="row-header" id="rowTitle">الأحدث والأكثر مشاهدة</div>
        <div class="cards-scroll-container" id="mediaGrid"></div>
    </div>

    <!-- نافذة تسجيل الدخول للمشرف -->
    <div class="modal" id="authModal">
        <div class="modal-content" style="max-width: 380px; padding: 25px;">
            <button class="close-btn" onclick="closeModal('authModal')">&times;</button>
            <h2 style="margin-bottom: 15px; text-align:center; color: var(--main-red);"><i class="fas fa-lock"></i> تسجيل الدخول</h2>
            <p style="font-size:0.8rem; color:#ccc; margin-bottom:15px; text-align:center;">قم بتسجيل الدخول لإضافة وإدارة المحتوى</p>
            <input type="email" id="email" value="abod@dmail.com" placeholder="البريد الإلكتروني" style="width:100%; padding:10px; margin-bottom:10px; background:#222; border:1px solid #444; color:white; border-radius:4px;">
            <input type="password" id="password" value="mmnnoopp99" placeholder="كلمة المرور" style="width:100%; padding:10px; margin-bottom:15px; background:#222; border:1px solid #444; color:white; border-radius:4px;">
            <button class="btn-stream btn-admin" style="width:100%; justify-content:center;" onclick="handleAuth()">دخول</button>
        </div>
    </div>

    <!-- مشغل الفيديو -->
    <div class="modal" id="playerModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closePlayer()">&times;</button>
            <div class="iframe-container">
                <iframe id="videoPlayer" allowfullscreen></iframe>
            </div>

            <div id="seasonsSelector" class="selector-box" style="display:none;"></div>
            <div id="episodesSelector" class="selector-box" style="display:none;"></div>

            <div class="comments-section">
                <h4><i class="fas fa-comments"></i> التعليقات</h4>
                <div style="display:flex; gap:10px; margin-top:10px;">
                    <input type="text" id="commentText" placeholder="أضف تعليقك..." style="flex:1; background:#222; border:1px solid #444; color:white; padding:8px; border-radius:4px;">
                    <button class="btn-stream btn-admin" onclick="addComment()">إرسال</button>
                </div>
                <div id="commentList" style="margin-top:15px;"></div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyALvUGKfiOLGjbnpldZ9IQfCR9sVMHU4WY",
            authDomain: "showa-4ea31.firebaseapp.com",
            databaseURL: "https://showa-4ea31-default-rtdb.firebaseio.com",
            projectId: "showa-4ea31",
            storageBucket: "showa-4ea31.firebasestorage.app",
            messagingSenderId: "161674174849",
            appId: "1:161674174849:web:2165916f33fe592db60880"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let allMedia = [];
        let currentFilter = 'الكل';
        let favorites = JSON.parse(localStorage.getItem('cinema_favs') || '[]');
        let activeMediaId = null;
        let seasonCounter = 0;

        window.addEventListener('scroll', () => {
            document.getElementById('navbar').classList.toggle('scrolled', window.scrollY > 50);
        });

        // متابعة حالة تسجيل الدخول
        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            const authBtn = document.getElementById('authBtn');
            const adminPanel = document.getElementById('adminPanel');

            if (user) {
                authBtn.innerText = "تسجيل الخروج";
                authBtn.onclick = () => signOut(auth);
                adminPanel.style.display = 'block'; // اظهار لوحة الإضافة عند تسجيل الدخول
            } else {
                authBtn.innerText = "دخول المشرف";
                authBtn.onclick = () => openAuthModal();
                adminPanel.style.display = 'none'; // إخفاء لوحة الإضافة للمستخدم العادي
            }
            loadData();
        });

        function loadData() {
            onSnapshot(collection(db, "media"), (snapshot) => {
                allMedia = [];
                snapshot.forEach(docSnap => allMedia.push({ id: docSnap.id, ...docSnap.data() }));
                if(allMedia.length > 0) setupHero(allMedia[0]);
                renderGrid(allMedia);
            });
        }

        function setupHero(item) {
            document.getElementById('heroBanner').style.backgroundImage = `url('${item.poster}')`;
            document.getElementById('heroTitle').innerText = item.title;
            document.getElementById('heroOverview').innerText = item.overview || 'أحد أفضل العروض المتوفرة على سينما ستريم.';
            document.getElementById('heroPlayBtn').onclick = () => openPlayer(item.id);
        }

        function renderGrid(list) {
            const grid = document.getElementById('mediaGrid');
            grid.innerHTML = '';

            let filtered = list;
            if (currentFilter === 'المفضلة') filtered = filtered.filter(i => favorites.includes(i.id));
            else if (currentFilter !== 'الكل') filtered = filtered.filter(i => i.type === currentFilter);

            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            if (searchVal) filtered = filtered.filter(i => i.title.toLowerCase().includes(searchVal));

            filtered.forEach(item => {
                const isFav = favorites.includes(item.id);
                const card = document.createElement('div');
                card.className = 'stream-card';
                card.style.backgroundImage = `url('${item.poster}')`;
                card.innerHTML = `
                    <div class="card-details">
                        <div class="card-title">${item.title}</div>
                        <div style="font-size: 0.7rem; color: #46d369;">${item.rating || '8.5'} ★</div>
                        <div class="card-actions">
                            <button class="action-icon" onclick="openPlayer('${item.id}')"><i class="fas fa-play"></i></button>
                            <button class="action-icon" onclick="toggleFavorite('${item.id}', event)"><i class="${isFav ? 'fas' : 'far'} fa-heart"></i></button>
                            ${currentUser ? `<button class="action-icon" onclick="deleteMedia('${item.id}', event)"><i class="fas fa-trash"></i></button>` : ''}
                        </div>
                    </div>
                `;
                card.onclick = (e) => { if(e.target.tagName !== 'I' && e.target.tagName !== 'BUTTON') openPlayer(item.id); };
                grid.appendChild(card);
            });
        }

        window.openPlayer = (id) => {
            const item = allMedia.find(m => m.id === id);
            if (!item) return;

            activeMediaId = id;
            const player = document.getElementById('videoPlayer');
            const seasonsBox = document.getElementById('seasonsSelector');
            const epBox = document.getElementById('episodesSelector');

            seasonsBox.innerHTML = '';
            epBox.innerHTML = '';

            if (item.type === 'مسلسل' && item.seasons && item.seasons.length > 0) {
                seasonsBox.style.display = 'flex';
                epBox.style.display = 'flex';

                item.seasons.forEach((s, sIdx) => {
                    const sBtn = document.createElement('button');
                    sBtn.className = `select-btn ${sIdx === 0 ? 'active' : ''}`;
                    sBtn.innerText = `الموسم ${s.seasonNumber}`;
                    sBtn.onclick = () => {
                        document.querySelectorAll('#seasonsSelector .select-btn').forEach(b => b.classList.remove('active'));
                        sBtn.classList.add('active');
                        renderEpisodes(s.episodes, player);
                    };
                    seasonsBox.appendChild(sBtn);
                });

                renderEpisodes(item.seasons[0].episodes, player);
            } else {
                seasonsBox.style.display = 'none';
                epBox.style.display = 'none';
                if(item.servers && item.servers.length > 0) player.src = item.servers[0].url;
            }

            loadComments(id);
            document.getElementById('playerModal').style.display = 'flex';
        };

        function renderEpisodes(episodes, player) {
            const epBox = document.getElementById('episodesSelector');
            epBox.innerHTML = '';
            if (!episodes || episodes.length === 0) return;

            episodes.forEach((ep, epIdx) => {
                const epBtn = document.createElement('button');
                epBtn.className = `select-btn ${epIdx === 0 ? 'active' : ''}`;
                epBtn.innerText = `حلقة ${ep.number}`;
                epBtn.onclick = () => {
                    document.querySelectorAll('#episodesSelector .select-btn').forEach(b => b.classList.remove('active'));
                    epBtn.classList.add('active');
                    player.src = ep.url;
                };
                epBox.appendChild(epBtn);
            });

            player.src = episodes[0].url;
        }

        window.addSeasonBlock = () => {
            seasonCounter++;
            const container = document.getElementById('seasonsContainer');
            const block = document.createElement('div');
            block.className = 'season-block';
            block.id = `season_block_${seasonCounter}`;
            block.innerHTML = `
                <div style="display:flex; justify-between; align-items:center; margin-bottom:8px;">
                    <strong>الموسم ${seasonCounter}</strong>
                    <input type="number" class="ep-count-input" placeholder="عدد الحلقات" min="1" style="width:120px;">
                    <button type="button" class="btn-stream btn-info" style="padding:4px 8px;" onclick="generateEpisodesForSeason(${seasonCounter})">توليد الحقول</button>
                </div>
                <div id="episodes_container_${seasonCounter}"></div>
            `;
            container.appendChild(block);
        };

        window.generateEpisodesForSeason = (sNum) => {
            const block = document.getElementById(`season_block_${sNum}`);
            const count = parseInt(block.querySelector('.ep-count-input').value) || 0;
            const container = document.getElementById(`episodes_container_${sNum}`);
            container.innerHTML = '';

            for (let i = 1; i <= count; i++) {
                const div = document.createElement('div');
                div.style.display = 'flex';
                div.style.gap = '8px';
                div.style.marginTop = '5px';
                div.innerHTML = `
                    <span style="font-size:0.8rem; width:50px;">ح ${i}:</span>
                    <input type="url" class="ep-url-input" data-ep="${i}" placeholder="رابط الحلقة (Embed)" required>
                `;
                container.appendChild(div);
            }
        };

        window.handleAddMedia = async (e) => {
            e.preventDefault();
            if (!currentUser) return alert("عذراً، يجب تسجيل الدخول لإضافة المحتوى.");

            const type = document.getElementById('type').value;
            let servers = [], seasons = [];

            if (type === 'فيلم') {
                servers.push({ name: 'سيرفر 1', url: document.getElementById('movieServer1').value });
            } else {
                const blocks = document.querySelectorAll('.season-block');
                blocks.forEach((block, idx) => {
                    const epInputs = block.querySelectorAll('.ep-url-input');
                    let episodes = [];
                    epInputs.forEach(input => {
                        if (input.value.trim()) {
                            episodes.push({ number: input.getAttribute('data-ep'), url: input.value.trim() });
                        }
                    });
                    if (episodes.length > 0) {
                        seasons.push({ seasonNumber: idx + 1, episodes });
                    }
                });
            }

            await addDoc(collection(db, "media"), {
                title: document.getElementById('title').value,
                type: type,
                year: document.getElementById('year').value || '2024',
                rating: document.getElementById('rating').value || '8.0',
                poster: document.getElementById('poster').value,
                overview: document.getElementById('overview').value,
                servers, seasons
            });

            document.getElementById('addMediaForm').reset();
            document.getElementById('seasonsContainer').innerHTML = '';
            seasonCounter = 0;
            alert("تم إدراج العمل بنجاح في سينما ستريم!");
        };

        async function loadComments(id) {
            const list = document.getElementById('commentList');
            const q = query(collection(db, "comments"), where("mediaId", "==", id));
            onSnapshot(q, (snap) => {
                list.innerHTML = '';
                snap.forEach(d => {
                    const c = d.data();
                    list.innerHTML += `<div class="comment-card"><strong>${c.user}</strong>: ${c.text}</div>`;
                });
            });
        }

        window.addComment = async () => {
            const txt = document.getElementById('commentText').value;
            if(!txt || !activeMediaId) return;
            const userName = currentUser ? currentUser.email : "زائر";
            await addDoc(collection(db, "comments"), { mediaId: activeMediaId, user: userName, text: txt });
            document.getElementById('commentText').value = '';
        };

        window.handleAuth = async () => {
            try {
                await signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value);
                closeModal('authModal');
            } catch(e) { alert("خطأ في تسجيل الدخول: " + e.message); }
        };

        window.toggleFavorite = (id, e) => {
            e.stopPropagation();
            if (favorites.includes(id)) favorites = favorites.filter(i => i !== id);
            else favorites.push(id);
            localStorage.setItem('cinema_favs', JSON.stringify(favorites));
            renderGrid(allMedia);
        };

        window.closePlayer = () => {
            document.getElementById('playerModal').style.display = 'none';
            document.getElementById('videoPlayer').src = '';
        };

        window.filterCategory = (cat) => {
            currentFilter = cat;
            document.getElementById('rowTitle').innerText = cat === 'الكل' ? 'الأحدث والأكثر مشاهدة' : cat;
            renderGrid(allMedia);
        };

        window.handleSearch = () => renderGrid(allMedia);
        window.deleteMedia = async (id, e) => {
            e.stopPropagation();
            if(confirm("هل تريد تأكيد حذف هذا العمل؟")) await deleteDoc(doc(db, "media", id));
        };

        window.openAuthModal = () => document.getElementById('authModal').style.display = 'flex';
        window.closeModal = (id) => document.getElementById(id).style.display = 'none';
        window.toggleTypeFields = () => {
            const type = document.getElementById('type').value;
            document.getElementById('movieServers').style.display = type === 'فيلم' ? 'block' : 'none';
            document.getElementById('seriesFields').style.display = type === 'مسلسل' ? 'block' : 'none';
        };
    </script>
</body>
</html>
