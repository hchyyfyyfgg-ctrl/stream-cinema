<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>سينما ستريم - دليل ومشاهدة الأفلام والمسلسلات</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0d0d0f;
            --card-bg: #161619;
            --main-red: #E50914;
            --accent-gold: #FFD700;
            --text-main: #FFFFFF;
            --text-sub: #a0a0a0;
            --border-color: #26262b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-main); color: var(--text-main); overflow-x: hidden; padding-bottom: 90px; }

        /* Header */
        header {
            display: flex; flex-direction: column; gap: 10px;
            padding: 12px 4%; background: rgba(13, 13, 15, 0.95); backdrop-filter: blur(12px);
            position: fixed; top: 0; width: 100%; z-index: 1000; border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .top-bar { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .logo { font-size: 1.3rem; font-weight: 900; color: var(--main-red); letter-spacing: 0.5px; display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
        
        .search-input {
            background: rgba(255,255,255,0.08); border: 1px solid var(--border-color); color: white;
            padding: 6px 14px; border-radius: 20px; outline: none; font-size: 0.8rem; width: 140px; transition: 0.3s;
        }
        .search-input:focus { width: 180px; background: #000; border-color: var(--main-red); }

        .nav-links { display: flex; gap: 10px; list-style: none; overflow-x: auto; white-space: nowrap; padding-bottom: 2px; }
        .nav-links::-webkit-scrollbar { display: none; }
        .nav-links a { color: var(--text-sub); text-decoration: none; font-size: 0.82rem; cursor: pointer; padding: 4px 10px; border-radius: 6px; transition: 0.2s; }
        .nav-links a.active { color: #fff; font-weight: bold; background: var(--main-red); }

        /* Filters Bar Container */
        .filters-container { margin-top: 125px; padding: 0 4%; display: flex; flex-direction: column; gap: 8px; }

        .bar-scroll { display: flex; gap: 8px; overflow-x: auto; white-space: nowrap; padding-bottom: 4px; }
        .bar-scroll::-webkit-scrollbar { display: none; }
        
        .filter-btn {
            background: #18181c; color: var(--text-sub); border: 1px solid var(--border-color);
            padding: 5px 12px; border-radius: 14px; font-size: 0.75rem; cursor: pointer; transition: 0.2s;
        }
        .filter-btn.active, .filter-btn:hover { background: var(--main-red); color: #fff; border-color: var(--main-red); }
        .genre-btn.active { background: #333; color: #fff; border-color: #666; }

        /* Hero Featured */
        .hero {
            position: relative; height: 42vh; min-height: 300px; background-size: cover; background-position: center top;
            display: flex; align-items: flex-end; padding: 0 4% 20px 4%; margin-top: 12px; border-radius: 16px; margin-inline: 4%; overflow: hidden;
            transition: background-image 0.5s ease-in-out;
        }
        .hero-overlay {
            position: absolute; inset: 0;
            background: linear-gradient(180deg, rgba(13,13,15,0) 0%, rgba(13,13,15,0.7) 60%, var(--bg-main) 100%);
        }
        .hero-content { position: relative; z-index: 10; width: 100%; }
        .badge-trend { background: var(--accent-gold); color: #000; font-size: 0.65rem; font-weight: bold; padding: 2px 8px; border-radius: 4px; display: inline-block; margin-bottom: 6px; }
        .hero-title { font-size: 1.5rem; font-weight: 800; margin-bottom: 6px; text-shadow: 2px 2px 8px rgba(0,0,0,0.8); }
        .hero-desc { font-size: 0.8rem; color: #ccc; margin-bottom: 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; max-width: 600px; }
        
        .hero-btns { display: flex; gap: 10px; }
        .btn-action {
            padding: 8px 18px; border-radius: 6px; font-size: 0.85rem; font-weight: bold;
            border: none; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: 0.2s;
        }
        .btn-play { background: var(--main-red); color: #fff; }
        .btn-play:active { transform: scale(0.95); }
        .btn-add { background: rgba(255,255,255,0.2); color: #fff; backdrop-filter: blur(8px); }

        /* Media Grid */
        .section-container { padding: 20px 4% 0 4%; }
        .section-title { font-size: 1.1rem; font-weight: bold; margin-bottom: 12px; color: #fff; }

        .media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 12px; }

        .card {
            background-size: cover; background-position: center; height: 165px;
            border-radius: 8px; position: relative; cursor: pointer; overflow: hidden;
            border: 1px solid var(--border-color); transition: transform 0.2s;
            background-color: #222;
        }
        .card:active { transform: scale(0.96); }
        .card-type { position: absolute; top: 6px; right: 6px; background: rgba(0,0,0,0.75); font-size: 0.6rem; padding: 2px 6px; border-radius: 4px; color: #fff; backdrop-filter: blur(4px); }
        .card-info {
            position: absolute; bottom: 0; inset-x: 0; background: linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.95) 100%);
            padding: 8px 6px 6px 6px; display: flex; flex-direction: column; gap: 2px;
        }
        .card-title { font-size: 0.75rem; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.65rem; color: var(--accent-gold); margin-top: 2px; }

        .loader { text-align: center; padding: 20px; color: var(--text-sub); font-size: 0.9rem; display: none; }

        /* Modal & Player */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 2000; justify-content: center; align-items: center; padding: 15px; }
        .modal-box { background: var(--card-bg); width: 100%; max-width: 650px; border-radius: 12px; overflow: hidden; position: relative; max-height: 90vh; overflow-y: auto; border: 1px solid var(--border-color); }
        .close-btn { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.8); border: none; color: white; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; z-index: 10; font-size: 1.1rem; }
        
        .detail-poster { width: 100%; height: 280px; object-fit: cover; border-bottom: 1px solid var(--border-color); }
        .media-details-box { padding: 16px; }
        .media-details-box h3 { font-size: 1.3rem; margin-bottom: 8px; color: #fff; }
        .detail-tags { display: flex; gap: 8px; font-size: 0.75rem; color: var(--accent-gold); margin-bottom: 12px; }
        .detail-tag { background: #222; padding: 2px 8px; border-radius: 4px; border: 1px solid #333; }
        .media-details-box p { font-size: 0.85rem; color: #ccc; line-height: 1.6; margin-bottom: 16px; }

        .player-container { width: 100%; height: 320px; background: #000; display: none; border-bottom: 1px solid var(--border-color); }
        .player-container iframe { width: 100%; height: 100%; border: none; }

        .watch-btn {
            background: var(--main-red); color: white; width: 100%; padding: 12px; border: none;
            border-radius: 8px; font-weight: bold; font-size: 0.95rem; cursor: pointer;
            display: flex; justify-content: center; align-items: center; gap: 8px; transition: 0.2s;
        }
        .watch-btn:hover { background: #cc0812; }

        @media (min-width: 600px) {
            .media-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; }
            .card { height: 210px; }
            .hero { height: 48vh; }
            .hero-title { font-size: 2.1rem; }
            .player-container { height: 380px; }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="top-bar">
            <div class="logo" onclick="location.reload()"><i class="fas fa-film"></i> سينما ستريم</div>
            <input type="text" class="search-input" id="searchInput" placeholder="بحث..." oninput="handleSearch()">
        </div>
        <ul class="nav-links">
            <li><a class="active" onclick="filterType('الكل', event)">الرئيسية</a></li>
            <li><a onclick="filterType('فيلم', event)">الأفلام</a></li>
            <li><a onclick="filterType('مسلسل', event)">المسلسلات</a></li>
            <li><a onclick="filterType('المفضلة', event)">المفضلة</a></li>
        </ul>
    </header>

    <!-- Filters Bar Container -->
    <div class="filters-container">
        <!-- Country / Language Filter -->
        <div class="bar-scroll" id="langBar">
            <button class="filter-btn active" onclick="filterLang(null, event)">🌍 كل الدول</button>
            <button class="filter-btn" onclick="filterLang('ar', event)">🇸🇦 عربي</button>
            <button class="filter-btn" onclick="filterLang('en', event)">🇺🇸 أجنبي</button>
            <button class="filter-btn" onclick="filterLang('hi', event)">🇮🇳 هندي</button>
            <button class="filter-btn" onclick="filterLang('ko', event)">🇰🇷 كوري</button>
            <button class="filter-btn" onclick="filterLang('ja', event)">🇯🇵 أنمي / ياباني</button>
            <button class="filter-btn" onclick="filterLang('tr', event)">🇹🇷 تركي</button>
        </div>

        <!-- Genres Filter -->
        <div class="bar-scroll" id="genresBar">
            <button class="filter-btn genre-btn active" onclick="filterGenre(null, event)">الكل</button>
            <button class="filter-btn genre-btn" onclick="filterGenre(28, event)">أكشن</button>
            <button class="filter-btn genre-btn" onclick="filterGenre(35, event)">كوميدي</button>
            <button class="filter-btn genre-btn" onclick="filterGenre(18, event)">دراما</button>
            <button class="filter-btn genre-btn" onclick="filterGenre(27, event)">رعب</button>
            <button class="filter-btn genre-btn" onclick="filterGenre(878, event)">خيال علمي</button>
            <button class="filter-btn genre-btn" onclick="filterGenre(10749, event)">رومانسي</button>
            <button class="filter-btn genre-btn" onclick="filterGenre(16, event)">أنيميشن</button>
        </div>
    </div>

    <!-- Banner -->
    <div class="hero" id="heroBanner">
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <span class="badge-trend"><i class="fas fa-fire"></i> العمل المتميز</span>
            <h1 class="hero-title" id="heroTitle">جاري التحميل...</h1>
            <p class="hero-desc" id="heroOverview">دليلك الكامل لمعرفة تفاصيل ومواشهدة أحدث الأفلام والمسلسلات.</p>
            <div class="hero-btns">
                <button class="btn-action btn-play" id="heroDetailsBtn"><i class="fas fa-play"></i> مشاهدة الآن</button>
                <button class="btn-action btn-add" onclick="toggleHeroFav()"><i class="fas fa-heart"></i> للمفضلة</button>
            </div>
        </div>
    </div>

    <!-- Media Grid -->
    <div class="section-container">
        <div class="section-title" id="gridTitle">الأحدث والمضاف مؤخراً</div>
        <div class="media-grid" id="mediaGrid"></div>
        <div class="loader" id="loader"><i class="fas fa-spinner fa-spin"></i> جاري تحميل المزيد...</div>
    </div>

    <!-- Details & Video Player Modal -->
    <div class="modal" id="detailsModal">
        <div class="modal-box">
            <button class="close-btn" onclick="closeModal('detailsModal')">&times;</button>
            
            <div class="player-container" id="playerContainer">
                <iframe id="videoIframe" src="" allowfullscreen></iframe>
            </div>

            <img id="detailPoster" class="detail-poster" src="" alt="Poster">
            
            <div class="media-details-box">
                <h3 id="detailTitle">-</h3>
                <div class="detail-tags">
                    <span class="detail-tag" id="detailType">-</span>
                    <span class="detail-tag" id="detailRating">★ -</span>
                    <span class="detail-tag" id="detailYear">-</span>
                </div>
                <p id="detailOverview">-</p>
                <button class="watch-btn" id="startWatchBtn" onclick="playMedia()"><i class="fas fa-play-circle"></i> مشاهدة الآن</button>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = "3fd2be6f0cd0561139e103d815d9b40a";
        const BASE_URL = "https://api.themoviedb.org/3";
        const IMAGE_PATH = "https://image.tmdb.org/t/p/w500";

        let loadedMedia = [];
        let currentType = 'الكل';
        let currentLang = null;
        let currentGenre = null;
        let currentPage = 1;
        let isLoading = false;
        let activeMedia = null;
        let favs = JSON.parse(localStorage.getItem('cinemastream_favs') || '[]');
        let currentHeroItem = null;

        document.addEventListener('DOMContentLoaded', () => {
            fetchMediaData(true);
            window.addEventListener('scroll', handleScroll);
        });

        async function fetchMediaData(reset = false) {
            if (isLoading) return;
            isLoading = true;
            document.getElementById('loader').style.display = 'block';

            if (reset) {
                currentPage = 1;
                loadedMedia = [];
            }

            try {
                let endpoint = '';
                const typeParam = currentType === 'مسلسل' ? 'tv' : 'movie';

                if (currentLang || currentGenre) {
                    endpoint = `${BASE_URL}/discover/${typeParam}?api_key=${API_KEY}&language=ar-SA&page=${currentPage}`;
                    if (currentLang) endpoint += `&with_original_language=${currentLang}`;
                    if (currentGenre) endpoint += `&with_genres=${currentGenre}`;
                } else if (currentType === 'فيلم') {
                    endpoint = `${BASE_URL}/movie/popular?api_key=${API_KEY}&language=ar-SA&page=${currentPage}`;
                } else if (currentType === 'مسلسل') {
                    endpoint = `${BASE_URL}/tv/popular?api_key=${API_KEY}&language=ar-SA&page=${currentPage}`;
                } else {
                    endpoint = `${BASE_URL}/trending/all/week?api_key=${API_KEY}&language=ar-SA&page=${currentPage}`;
                }

                const res = await fetch(endpoint);
                const data = await res.json();

                const newItems = (data.results || [])
                    .filter(item => item.media_type !== 'person')
                    .map(item => formatMediaData(item.title ? 'فيلم' : 'مسلسل', item));

                loadedMedia = [...loadedMedia, ...newItems];

                if (reset && loadedMedia.length > 0) {
                    renderHero(loadedMedia[0]);
                }

                renderGrid(loadedMedia);
                currentPage++;
            } catch (err) {
                console.error("خطأ في جلب البيانات:", err);
            } finally {
                isLoading = false;
                document.getElementById('loader').style.display = 'none';
            }
        }

        function formatMediaData(type, item) {
            return {
                id: item.id.toString(),
                title: item.title || item.name,
                type: item.title ? 'فيلم' : 'مسلسل',
                rawType: item.title ? 'movie' : 'tv',
                year: (item.release_date || item.first_air_date || '2024').split('-')[0],
                rating: item.vote_average ? item.vote_average.toFixed(1) : '8.0',
                poster: item.poster_path ? `${IMAGE_PATH}${item.poster_path}` : 'https://via.placeholder.com/500x750?text=No+Poster',
                overview: item.overview || 'لا توجد قصة متاحة لهذا العمل حالياً.'
            };
        }

        function renderHero(item) {
            currentHeroItem = item;
            document.getElementById('heroBanner').style.backgroundImage = `url('${item.poster}')`;
            document.getElementById('heroTitle').innerText = item.title;
            document.getElementById('heroOverview').innerText = item.overview;
            document.getElementById('heroDetailsBtn').onclick = () => showDetails(item.id);
        }

        window.toggleHeroFav = () => { if (currentHeroItem) toggleFav(currentHeroItem.id); };

        function renderGrid(list) {
            const grid = document.getElementById('mediaGrid');

            let filtered = list;
            if (currentType === 'المفضلة') {
                filtered = filtered.filter(i => favs.includes(i.id));
            }

            const q = document.getElementById('searchInput').value.toLowerCase();
            if (q) filtered = filtered.filter(i => i.title.toLowerCase().includes(q));

            if (filtered.length === 0 && currentPage === 1) {
                grid.innerHTML = `<div style="color:#888; font-size:0.85rem; grid-column: 1/-1; padding:20px 0;">لا تتوفر نتائج لهذا التصنيف.</div>`;
                return;
            }

            grid.innerHTML = '';
            filtered.forEach(item => {
                const isFav = favs.includes(item.id);
                const card = document.createElement('div');
                card.className = 'card';
                card.style.backgroundImage = `url('${item.poster}')`;
                card.innerHTML = `
                    <div class="card-type">${item.type}</div>
                    <div class="card-info">
                        <div class="card-title">${item.title}</div>
                        <div class="card-meta">
                            <span>★ ${item.rating}</span>
                            <i class="${isFav ? 'fas' : 'far'} fa-heart" onclick="toggleFav('${item.id}', event)" style="${isFav ? 'color:red;' : ''}"></i>
                        </div>
                    </div>
                `;
                card.onclick = (e) => { if (e.target.tagName !== 'I') showDetails(item.id); };
                grid.appendChild(card);
            });
        }

        function handleScroll() {
            if (currentType === 'المفضلة') return;
            if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 500) {
                fetchMediaData(false);
            }
        }

        window.filterType = (type, e) => {
            currentType = type;
            document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('active'));
            if (e) e.target.classList.add('active');
            document.getElementById('gridTitle').innerText = type === 'الكل' ? 'الأحدث والمضاف مؤخراً' : type;
            fetchMediaData(true);
        };

        window.filterLang = (langCode, e) => {
            currentLang = langCode;
            document.querySelectorAll('#langBar .filter-btn').forEach(btn => btn.classList.remove('active'));
            if (e) e.target.classList.add('active');
            fetchMediaData(true);
        };

        window.filterGenre = (genreId, e) => {
            currentGenre = genreId;
            document.querySelectorAll('#genresBar .filter-btn').forEach(btn => btn.classList.remove('active'));
            if (e) e.target.classList.add('active');
            fetchMediaData(true);
        };

        let searchTimeout = null;
        window.handleSearch = () => {
            clearTimeout(searchTimeout);
            const query = document.getElementById('searchInput').value.trim();

            if (!query) {
                renderGrid(loadedMedia);
                return;
            }

            searchTimeout = setTimeout(async () => {
                try {
                    const res = await fetch(`${BASE_URL}/search/multi?api_key=${API_KEY}&language=ar-SA&query=${encodeURIComponent(query)}`);
                    const data = await res.json();
                    
                    const searchResults = data.results
                        .filter(i => i.media_type === 'movie' || i.media_type === 'tv')
                        .map(i => formatMediaData(i.media_type === 'movie' ? 'فيلم' : 'مسلسل', i));

                    renderGrid(searchResults);
                } catch (e) {
                    console.error("خطأ في البحث:", e);
                }
            }, 400);
        };

        window.showDetails = (id) => {
            const item = loadedMedia.find(m => m.id === id);
            if (!item) return;

            activeMedia = item;
            document.getElementById('playerContainer').style.display = 'none';
            document.getElementById('videoIframe').src = '';
            document.getElementById('detailPoster').style.display = 'block';

            document.getElementById('detailPoster').src = item.poster;
            document.getElementById('detailTitle').innerText = item.title;
            document.getElementById('detailType').innerText = item.type;
            document.getElementById('detailRating').innerText = `★ ${item.rating}`;
            document.getElementById('detailYear').innerText = item.year;
            document.getElementById('detailOverview').innerText = item.overview;

            document.getElementById('detailsModal').style.display = 'flex';
        };

        // وظيفة التشغيل الحقيقي
        window.playMedia = () => {
            if (!activeMedia) return;

            let streamUrl = '';
            if (activeMedia.rawType === 'movie') {
                streamUrl = `https://vidsrc.to/embed/movie/${activeMedia.id}`;
            } else {
                streamUrl = `https://vidsrc.to/embed/tv/${activeMedia.id}/1/1`;
            }

            document.getElementById('detailPoster').style.display = 'none';
            document.getElementById('playerContainer').style.display = 'block';
            document.getElementById('videoIframe').src = streamUrl;
        };

        window.toggleFav = (id, e) => {
            if (e) e.stopPropagation();
            if (favs.includes(id)) favs = favs.filter(i => i !== id);
            else favs.push(id);
            localStorage.setItem('cinemastream_favs', JSON.stringify(favs));
            renderGrid(loadedMedia);
        };

        window.closeModal = (id) => {
            document.getElementById('videoIframe').src = '';
            document.getElementById(id).style.display = 'none';
        };
    </script>
</body>
</html>
